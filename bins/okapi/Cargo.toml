[package]
name = "okapi"
version.workspace = true
edition.workspace = true
license.workspace = true
# 单二进制产品，crate 不发布到 crates.io（cargo-deny 据此跳过自有 crate 的许可证核对）
publish = false
description = "Okapi 单二进制多角色入口：gateway / console / worker / all"

[dependencies]
okapi-kernel = { workspace = true }
okapi-gateway = { workspace = true }
okapi-console = { workspace = true }
okapi-worker = { workspace = true }
okapi-domain = { workspace = true }
okapi-ledger = { workspace = true }
okapi-store = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sqlx.workspace = true
chrono.workspace = true

[features]
# 发布形态：前端产物嵌入二进制（构建前需 `pnpm -C frontend build`）
embed-web = ["okapi-console/embed-web"]

[dev-dependencies]
okapi-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["process"] }
reqwest = { workspace = true }
bcrypt = { workspace = true }
okapi-pricing = { workspace = true }
okapi-providers = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
fred = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
md-5 = { workspace = true }
tokio-tungstenite = { workspace = true }
# examples/loadgen 读 .env
dotenvy = { workspace = true }

[lints]
workspace = true
