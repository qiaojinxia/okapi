# 本地开发依赖（M1）：PostgreSQL + Redis
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# 无 compose 插件时：bash scripts/dev-deps.sh up
# 镜像走 public.ecr.aws（规避对 registry-1.docker.io 的网络劫持）
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: okapi-dev-pg
    environment:
      POSTGRES_USER: okapi
      POSTGRES_PASSWORD: okapi_dev
      POSTGRES_DB: okapi
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okapi -d okapi"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: okapi-dev-redis
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
