# Okapi 前置 Nginx 模板（IMPLEMENTATION §14.1：SSE 反直觉项清单）。
# 放入 http {} 块引用；按需替换 server_name 与 upstream 地址。

underscores_in_headers on;    # 带下划线的会话头（session_id）默认被丢弃，会破坏 L2 粘性路由

# 来源 IP 相关头统一在这里归一化（§14.2）。网关只信任来自 OKAPI_TRUSTED_PROXIES 内
# 对端的转发头，所以这台反代必须自己保证这些头是干净的：
#  - X-Forwarded-For 用 $proxy_add_x_forwarded_for（追加），网关取**最右非信任跳**；
#  - CDN 专用头 nginx 默认原样透传，调用方随手就能伪造 → 一律清空后由本层重设。
# 网关侧对应配置：OKAPI_TRUSTED_PROXIES=127.0.0.1/32,::1/128（与本文件 upstream 一致）。
map $host $okapi_blank { default ""; }

upstream okapi_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream okapi_console {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 32m;         # 与网关请求体上限一致（§3.7-8）

    # 数据面：SSE 长流
    location /v1/ {
        proxy_pass http://okapi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
        proxy_buffering off;          # SSE 必须；配合响应头 X-Accel-Buffering: no
        gzip off;                     # event-stream 禁压缩缓冲
        proxy_read_timeout 1h;        # 长流；禁止默认 60s
        proxy_send_timeout 1h;
    }

    # custom_pass 透传（响应可能为大文件流）
    location /pass/ {
        proxy_pass http://okapi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;
        proxy_buffering off;
        proxy_read_timeout 30m;
    }

    # 控制面 + 前端 SPA
    location / {
        proxy_pass http://okapi_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
    }
}
