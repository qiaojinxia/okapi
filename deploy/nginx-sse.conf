# Okapi 前置 Nginx 模板（IMPLEMENTATION §14.1：SSE 反直觉项清单）。
# 放入 http {} 块引用；按需替换 server_name 与 upstream 地址。

underscores_in_headers on;    # 带下划线的会话头（session_id）默认被丢弃，会破坏 L2 粘性路由

# 来源 IP 相关头统一在这里归一化（§14.2）。网关只信任来自 OKAPI_TRUSTED_PROXIES 内
# 对端的转发头，所以这台反代必须自己保证这些头是干净的：
#  - X-Forwarded-For 用 $proxy_add_x_forwarded_for（追加），网关取**最右非信任跳**；
#  - CDN 专用头 nginx 默认原样透传，调用方随手就能伪造 → 一律清空后由本层重设。
# 网关侧对应配置：OKAPI_TRUSTED_PROXIES=127.0.0.1/32,::1/128（与本文件 upstream 一致）。
map $host $okapi_blank { default ""; }

# WebSocket 入口（Codex 的 Responses WS、/v1/realtime）要把 Upgrade 带过去；
# 普通请求的 Connection 仍为空，好复用到网关的长连接（keepalive）。
map $http_upgrade $okapi_connection {
    default upgrade;
    ''      '';
}

# 访问日志里不能留 API key。Gemini 原生入口支持把密钥放在 URL 里（?key=...），nginx 缺省的 combined
# 格式会把 $request 的整条查询串写进日志（网关自己特意只记路径、不记查询，模板不该再把它漏回来）。
# 这里把 key 参数的值换成 ***，其余参数原样保留。注意：出错请求在 error_log 里的 `request:` 行仍带
# 完整查询串，需要彻底避免就让客户端改用 x-goog-api-key 头。
map $request $okapi_logged_request {
    default $request;
    ~^(?<okapi_head>.*[?&]key=)[^&\s]*(?<okapi_tail>.*)$  "${okapi_head}***${okapi_tail}";
}
log_format okapi_redacted '$remote_addr - $remote_user [$time_local] "$okapi_logged_request" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream okapi_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream okapi_console {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name api.example.com;

    access_log /var/log/nginx/access.log okapi_redacted;   # 覆盖 http 级缺省的 combined（带完整查询串）

    client_max_body_size 32m;         # 与网关请求体上限一致（§3.7-8）；批量生图提交单独放宽，见下

    # 批量生图提交：网关只对这一条路由把请求体上限放宽到 128MB（gateway::router 里的 DefaultBodyLimit），
    # 其余入口仍是 32MB。server 级的 32m 会把 32–128MB 的批量请求在这里就 413 掉，应用层放开的额度形同虚设。
    location = /v1/images/batches {
        client_max_body_size 128m;
        proxy_pass http://okapi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
        proxy_read_timeout 10m;       # 大请求体上传 + 受理
        proxy_send_timeout 10m;
    }

    # 数据面：SSE 长流。网关注册的全部入口前缀都要列在这里（guard-deploy-manifests.py 按路由清单核对）：
    #   /v1/      OpenAI / Anthropic 兼容入口、Responses WS、Realtime
    #   /v1beta/  Gemini 原生入口
    #   /images/  无 /v1 前缀的图片异步任务别名
    # 漏掉的前缀会落进下面的 location /，被转给控制面——拿到的是 SPA 的 HTML 壳，不是 JSON。
    location ~ ^/(v1|v1beta|images)/ {
        proxy_pass http://okapi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $okapi_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
        proxy_buffering off;          # SSE 必须；配合响应头 X-Accel-Buffering: no
        gzip off;                     # event-stream 禁压缩缓冲
        proxy_read_timeout 1h;        # 长流；禁止默认 60s
        proxy_send_timeout 1h;
    }

    # custom_pass 透传（响应可能为大文件流）
    location /pass/ {
        proxy_pass http://okapi_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;
        proxy_buffering off;
        proxy_read_timeout 30m;
    }

    # 控制面里的两条 SSE：Playground 中继 /api/me/playground/chat 与渠道试用 /admin/channels/{id}/try
    # （都是数据面处理器的流）。落在下面的 location / 会被 nginx 缓冲成整段再发（打字机攒成一坨），
    # 读超时也只是默认 60s。网关会发 X-Accel-Buffering: no，这里再显式写一遍，并放宽超时。
    location ~ ^/(api/me/playground/chat|admin/channels/[0-9]+/try)$ {
        proxy_pass http://okapi_console;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # 控制面 + 前端 SPA
    location / {
        proxy_pass http://okapi_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $okapi_blank;   # 清掉调用方伪造的 CDN 头
        proxy_set_header True-Client-IP $okapi_blank;
        proxy_set_header X-Okapi-Peer-IP $okapi_blank;    # 网关内部头，外部一律不得带入
    }
}
