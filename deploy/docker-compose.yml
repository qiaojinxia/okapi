# Okapi 中型站形态（IMPLEMENTATION §2.4：gateway ×2 + console + worker + 全套依赖）。
# 单机形态更简：`docker compose up okapi-all postgres redis` 即可（NATS/CH 可选）。
#
#   docker compose -f deploy/docker-compose.yml --profile multi up -d    # 多角色
#   docker compose -f deploy/docker-compose.yml --profile single up -d  # 单机 all

name: okapi

x-okapi-env: &okapi-env
  DATABASE_URL: postgres://okapi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/okapi
  OKAPI_REDIS_URL: redis://redis:6379
  OKAPI_NATS_URL: nats://nats:4222
  OKAPI_CLICKHOUSE_URL: http://okapi:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}@clickhouse:8123
  OKAPI_BIND: 0.0.0.0:8080
  OKAPI_CONSOLE_BIND: 0.0.0.0:8081
  OKAPI_MASTER_KEY: ${OKAPI_MASTER_KEY:?run `openssl rand -hex 32`}
  # 信任反代来源（§14.2）：只有来自这些地址的 X-Forwarded-For / CDN 头才作数，其余来源一律
  # 按 socket 对端算 client_ip。缺省只信环回：整段私网（172.16/12、10/8）会让同机其他容器、
  # 内网客户端伪造来源 IP，绕过 key 级 IP 白名单与每 IP 限流。前面有反代时把反代的地址或
  # 网段写进来（容器反代给它固定 IP 再填那一个），公网 CDN 填回源段，或改用 OKAPI_EDGE_KEY；
  # 不配则 client_ip 记成反代的地址。
  OKAPI_TRUSTED_PROXIES: ${OKAPI_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
  OKAPI_SETUP_TOKEN: ${OKAPI_SETUP_TOKEN:?set OKAPI_SETUP_TOKEN for first initialization}
  OKAPI_EDGE_KEY: ${OKAPI_EDGE_KEY:-}
  # 每个容器各开一套 PG 池，总连接 = Σ(副本数 × 本值)。本文件 multi profile 是
  # gateway 2 + console 1 + worker 1 = 4 个容器 × 12 = 48 条，PG 缺省 max_connections=100 够用；
  # single profile 的 okapi-all 一个容器里三个角色各开一套池，占 3 × 12 = 36 条。
  # 扩 gateway 副本前重算连接预算。PgBouncer 仅支持 session 模式：账本使用会话级 advisory lock。
  OKAPI_PG_POOL: ${OKAPI_PG_POOL:-12}

x-okapi-image: &okapi-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  # SIGTERM 后排完在途 SSE（§14.3 口径 5min）再等后台结算落账；compose 缺省 10s 就 SIGKILL
  stop_grace_period: 5m30s
  # json-file 缺省不限大小，按大小轮转。它的日志随容器删除，每次部署重建容器就清空了；
  # 要跨部署留存，在宿主机的 override 里换成 journald（Docker Desktop 不支持，所以不设成缺省）。
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    # 慢查询可观测：pg_stat_statements 按归一化语句累计次数 / 耗时（扩展需在库里
    # `CREATE EXTENSION pg_stat_statements` 一次），超过 1 秒的语句另写进 PG 日志。
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: okapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: okapi
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okapi"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  nats:
    image: public.ecr.aws/docker/library/nats:2-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: okapi
      CLICKHOUSE_USER: okapi
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    volumes:
      - ch-data:/var/lib/clickhouse
      - ./clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/okapi-system-logs.xml:ro
    ulimits:
      nofile: 262144
    restart: unless-stopped

  # ---- 单机形态 ----
  okapi-all:
    <<: *okapi-image
    profiles: [single]
    command: ["all"]
    environment: *okapi-env
    ports:
      - "8080:8080"   # 数据面 /v1/*
      - "127.0.0.1:8081:8081"   # 控制面 + 前端

  # ---- 多角色形态 ----
  gateway:
    <<: *okapi-image
    profiles: [multi]
    command: ["gateway"]
    environment: *okapi-env
    deploy:
      replicas: 2
    ports:
      - "8080"

  console:
    <<: *okapi-image
    profiles: [multi]
    command: ["console"]
    environment: *okapi-env
    ports:
      - "127.0.0.1:8081:8081"

  worker:
    <<: *okapi-image
    profiles: [multi]
    command: ["worker"]
    environment: *okapi-env

volumes:
  pg-data:
  redis-data:
  nats-data:
  ch-data:
