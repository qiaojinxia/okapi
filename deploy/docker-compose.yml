# Okapi 中型站形态（IMPLEMENTATION §2.4：gateway ×2 + console + worker + 全套依赖）。
# 单机形态更简：`docker compose up okapi-all postgres redis` 即可（NATS/CH 可选）。
#
#   docker compose -f deploy/docker-compose.yml --profile multi up -d    # 多角色
#   docker compose -f deploy/docker-compose.yml --profile single up -d  # 单机 all

name: okapi

x-okapi-env: &okapi-env
  DATABASE_URL: postgres://okapi:${POSTGRES_PASSWORD:-okapi_dev}@postgres:5432/okapi
  OKAPI_REDIS_URL: redis://redis:6379
  OKAPI_NATS_URL: nats://nats:4222
  OKAPI_CLICKHOUSE_URL: http://okapi:${CLICKHOUSE_PASSWORD:-okapi_dev}@clickhouse:8123
  OKAPI_BIND: 0.0.0.0:8080
  OKAPI_CONSOLE_BIND: 0.0.0.0:8081
  OKAPI_MASTER_KEY: ${OKAPI_MASTER_KEY:?run `openssl rand -hex 32`}
  # 信任反代网段（§14.2）：容器里反代与网关不同 IP，环回缺省不够用。
  # 只有来自这些来源的 X-Forwarded-For / CDN 头才作数——不配就等于 key 级 IP 白名单、
  # 每 IP 限流与 client_ip 列可被调用方一个请求头改写。默认给 compose 的私网段；
  # 前面还有一层公网 CDN 时改配 CDN 回源段，或改用 OKAPI_EDGE_KEY。
  OKAPI_TRUSTED_PROXIES: ${OKAPI_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8}
  OKAPI_EDGE_KEY: ${OKAPI_EDGE_KEY:-}
  # 每个容器各开一套 PG 池，总连接 = Σ(副本数 × 本值)。本文件 multi profile 是
  # gateway 2 + console 1 + worker 1 = 4 个容器 × 12 = 48 条，PG 缺省 max_connections=100 够用；
  # 往上扩 gateway 副本数前先把这笔账重算一遍（或上 PgBouncer transaction 模式）。
  OKAPI_PG_POOL: ${OKAPI_PG_POOL:-12}

x-okapi-image: &okapi-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: okapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okapi_dev}
      POSTGRES_DB: okapi
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okapi"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  nats:
    image: public.ecr.aws/docker/library/nats:2-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: okapi
      CLICKHOUSE_USER: okapi
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-okapi_dev}
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    restart: unless-stopped

  # ---- 单机形态 ----
  okapi-all:
    <<: *okapi-image
    profiles: [single]
    command: ["all"]
    environment: *okapi-env
    ports:
      - "8080:8080"   # 数据面 /v1/*
      - "8081:8081"   # 控制面 + 前端

  # ---- 多角色形态 ----
  gateway:
    <<: *okapi-image
    profiles: [multi]
    command: ["gateway"]
    environment: *okapi-env
    deploy:
      replicas: 2
    ports:
      - "8080"

  console:
    <<: *okapi-image
    profiles: [multi]
    command: ["console"]
    environment: *okapi-env
    ports:
      - "8081:8081"

  worker:
    <<: *okapi-image
    profiles: [multi]
    command: ["worker"]
    environment: *okapi-env

volumes:
  pg-data:
  redis-data:
  nats-data:
  ch-data:
