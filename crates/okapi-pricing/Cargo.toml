[package]
name = "okapi-pricing"
version.workspace = true
edition.workspace = true
# 单二进制产品，crate 不发布到 crates.io（cargo-deny 据此跳过自有 crate 的许可证核对）
publish = false
description = "Okapi 定价域：PriceBook 编译器、修饰器栈、计费引擎（纯乘加）、ArcSwap 热更"

[dependencies]
