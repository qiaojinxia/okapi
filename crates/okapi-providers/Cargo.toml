[package]
name = "okapi-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
# 单二进制产品，crate 不发布到 crates.io（cargo-deny 据此跳过自有 crate 的许可证核对）
publish = false
description = "Okapi 上游适配：Provider trait + 按方向拆的协议转换（M1+）"

[dependencies]
okapi-api = { workspace = true }
okapi-domain = { workspace = true }

async-trait = { workspace = true }
# Bedrock SigV4（hmac/sha2）与 Vertex 服务账号 JWT RS256（aws-lc-rs：reqwest/rustls 现用的
# crypto provider，不是新栈）——IMPLEMENTATION §11.35
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
# Claude Code 外形的出站连接（client_tls.rs）：BoringSSL 握手 + hyper HTTP/1.1；https 出口代理那一跳用 rustls
boring = { workspace = true }
tokio-boring = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
tower-service = { workspace = true }
percent-encoding = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
webpki-root-certs = { workspace = true }
async-compression = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
