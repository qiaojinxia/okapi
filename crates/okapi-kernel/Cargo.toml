[package]
name = "okapi-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Okapi 各角色共用的底层：错误、提取器、共用状态、鉴权、调度 Redis、配置、对账与修复"

[dependencies]
rustix = { version = "1", features = ["fs"] }
okapi-api = { workspace = true }
okapi-domain = { workspace = true }
okapi-ledger = { workspace = true }
okapi-pricing = { workspace = true }
okapi-providers = { workspace = true }
okapi-store = { workspace = true }
anyhow = { workspace = true }
async-nats = { workspace = true }
axum = { workspace = true }
dotenvy = { workspace = true }
fred = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
moka = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sqlx.workspace = true
chrono.workspace = true
lettre = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
okapi-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
