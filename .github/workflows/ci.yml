name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 编译期 SQL 校验走 .sqlx 离线快照；集成测试运行期连接 services
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://okapi:okapi_dev@localhost:5432/okapi
  OKAPI_REDIS_URL: redis://localhost:6379
  OKAPI_CLICKHOUSE_URL: http://okapi:okapi_dev@localhost:8123
  OKAPI_NATS_URL: nats://127.0.0.1:4222
  OKAPI_WEB_DIR: ${{ github.workspace }}/frontend/dist

jobs:
  check:
    needs: frontend
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okapi
          POSTGRES_PASSWORD: okapi_dev
          POSTGRES_DB: okapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: okapi
          CLICKHOUSE_USER: okapi
          CLICKHOUSE_PASSWORD: okapi_dev
        ports:
          - 8123:8123
        # 探活必须写 127.0.0.1：alpine 里 localhost 先解析到 ::1，而容器网络没有 IPv6，
        # clickhouse 只绑到了 0.0.0.0，用 localhost 探活会一直 Connection refused，
        # service 永远起不来，整个 check job 在 Initialize containers 就挂（本地容器复现取证）
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: 读取前端构建产物供 SPA 导航测试
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
      # services 不支持传入 -js；独立启动，确保消息链路在 CI 真正执行。
      - name: 启动 NATS JetStream
        run: |
          docker run -d --name okapi-ci-nats \
            -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            public.ecr.aws/docker/library/nats:2-alpine -js -m 8222
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8222/healthz
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all --check
      - name: 计费红线守卫
        run: bash scripts/guard-no-float.sh
      - name: API 路由清单与验证报告守卫
        run: |
          python3 scripts/test_api_surface.py
          python3 scripts/test_core_test_summary.py
          python3 scripts/api-surface.py --check docs/api-surface.json
      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试并生成逐套件报告
        shell: bash
        run: |
          # 全局配置用例顺序执行；用例内部的并发/竞态断言仍照常运行。
          set +e
          cargo test --workspace --locked --no-fail-fast -- --test-threads=1 --nocapture 2>&1 | tee core-tests.log
          okapi_test_exit=${PIPESTATUS[0]}
          set -e
          python3 scripts/summarize-core-tests.py core-tests.log --out core-tests.json --exit-code "$okapi_test_exit"
          if [ "$okapi_test_exit" -ne 0 ]; then exit "$okapi_test_exit"; fi
          python3 -c 'import json; r = json.load(open("core-tests.json")); assert r["execution_status"] == "passed", r["execution_status"]'
      - name: 保存完整测试输出与验证报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-api-verification
          path: |
            core-tests.log
            core-tests.json
          if-no-files-found: ignore
          retention-days: 7

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: 构建（vite + tsc）
        run: pnpm build
        working-directory: frontend
      - name: 保存前端构建产物
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
      - name: lint（oxlint）
        run: pnpm lint
        working-directory: frontend
      - name: i18n 红线守卫
        run: bash scripts/guard-i18n.sh
      - name: i18n 键完备性（缺键会把原始键渲染到界面）
        run: python3 scripts/guard-i18n-keys.py
      - name: 前端权限点存在性（写错会对自定义角色永久隐藏入口）
        run: python3 scripts/guard-frontend-permissions.py
      - name: 后端 error_code 全集反向核对（缺文案用户只看到"未知错误 (code)"）
        run: python3 scripts/guard-error-codes.py
      - name: 部署模板守卫（healthz 探针、下线宽限期、PG 连接预算）
        run: python3 scripts/guard-deploy-manifests.py
