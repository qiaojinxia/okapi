[advisories]
version = 2

[licenses]
version = 2
# 自有 crate 全部 publish = false：项目许可证仍是 IMPLEMENTATION §15 的开放项，但不能让它把
# 第三方依赖的许可证 / 漏洞 / 来源检查一起压成常红（常红的守卫等于没有守卫）
private = { ignore = true }
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# CI 的 cargo-deny-action 缺省带 --all-features：embed-web 特性经 rust-embed 的 proc-macro
# （rust-embed-impl → shellexpand → dirs → dirs-sys）拉进 option-ext（MPL-2.0）。它只在编译期
# 帮 proc-macro 找配置目录，不进产物；按 crate 单独放行而不把 MPL 加进全局 allow
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
