[advisories]
version = 2

[licenses]
version = 2
# 自有 crate 全部 publish = false，按 private 跳过：项目自身是 AGPL-3.0-only（见 LICENSE），不进下面的放行表。
# 第三方依赖只放行宽松许可证——混进 copyleft 依赖会堵死商业双许可（IMPLEMENTATION §15）
private = { ignore = true }
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# CI 的 cargo-deny-action 缺省带 --all-features：embed-web 特性经 rust-embed 的 proc-macro
# （rust-embed-impl → shellexpand → dirs → dirs-sys）拉进 option-ext（MPL-2.0）。它只在编译期
# 帮 proc-macro 找配置目录，不进产物；按 crate 单独放行而不把 MPL 加进全局 allow
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

# Versioned Claude Code wire checksums use this pure Rust XXH64 implementation.
[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
